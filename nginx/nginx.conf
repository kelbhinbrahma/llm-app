# Nginx = the load balancer. It receives every request on port 80
# and forwards it to one of the FastAPI containers (round robin).

upstream fastapi_instances {
    # "api" is the service name in docker-compose.yml. Docker's DNS returns
    # the IP of every api container, so "docker compose up --scale api=3" just works.
    server api:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://fastapi_instances;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        # if one instance fails, try another one
        proxy_next_upstream error timeout http_502 http_503;
    }
}
